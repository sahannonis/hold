name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Check Android tools
        run: |
          chmod +x scripts/ci-run.sh
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          ls "${ANDROID_HOME}/platforms" || echo "::error title=Android SDK::No SDK platforms found at ANDROID_HOME=${ANDROID_HOME:-unset}"

      - name: Install packages
        run: scripts/ci-run.sh "npm install" npm install --no-audit --no-fund

      - name: Build the web game for the app
        run: scripts/ci-run.sh "build-web" node scripts/build-web.mjs

      - name: Create the Android project
        run: |
          scripts/ci-run.sh "cap add android" npx cap add android
          scripts/ci-run.sh "icons" npx @capacitor/assets generate --android --iconBackgroundColor '#0e0b10' --iconBackgroundColorDark '#0e0b10' --splashBackgroundColor '#0e0b10' --splashBackgroundColorDark '#0e0b10'
          scripts/ci-run.sh "patch-android" node scripts/patch-android.mjs
          scripts/ci-run.sh "cap sync" npx cap sync android
          v=$(npm ls @capacitor/android @capacitor/core @capacitor/haptics 2>/dev/null | tr '\n' ' ')
          echo "::notice title=Versions::${v}"

      - name: Find the upload key
        env:
          KEYSTORE_B64: ${{ secrets.HOLD_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.HOLD_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_PASS" ]; then
            echo "::warning title=Signing::No HOLD_KEYSTORE_PASSWORD secret yet, so the .aab is unsigned and Play Console will refuse it."
          elif [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "HOLD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          elif [ -f keys/hold-upload.jks ]; then
            cp keys/hold-upload.jks "$RUNNER_TEMP/upload.jks"
            echo "HOLD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::error title=Signing::Password secret is set but no keystore was found."
            exit 1
          fi

      - name: Build test APK and Play Store bundle
        working-directory: android
        env:
          HOLD_KEYSTORE_PASSWORD: ${{ secrets.HOLD_KEYSTORE_PASSWORD }}
          HOLD_KEY_ALIAS: ${{ secrets.HOLD_KEY_ALIAS || 'hold-upload' }}
          HOLD_KEY_PASSWORD: ${{ secrets.HOLD_KEY_PASSWORD || secrets.HOLD_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ../scripts/ci-run.sh "gradle" ./gradlew --no-daemon assembleDebug bundleRelease

      - name: Check the signature
        run: |
          f=$(ls android/app/build/outputs/bundle/release/*.aab)
          signer=$(keytool -printcert -jarfile "$f" 2>/dev/null | grep -m1 "Owner:" || true)
          if [ -n "$signer" ]; then echo "::notice title=Signed::$signer"; echo "SIGNED=1" >> "$GITHUB_ENV"
          else echo "::warning title=Signed::The .aab has no signature."; fi

      - name: Collect files
        run: |
          mkdir -p out
          cp android/app/build/outputs/bundle/release/*.aab out/hold-${{ github.run_number }}.aab
          cp android/app/build/outputs/apk/debug/*.apk out/hold-${{ github.run_number }}-phone-test.apk
          echo "::notice title=Built::$(ls out | tr '\n' ' ')"

      - uses: actions/upload-artifact@v4
        with:
          name: hold-build-${{ github.run_number }}
          path: out/
          retention-days: 30

      - name: Publish to the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.run_number }}
        run: |
          if [ -n "${SIGNED:-}" ]; then
            signed="signed with your upload key, ready for Play Console"
          else
            signed="UNSIGNED. Add the signing secrets and rebuild before uploading to Play Console"
          fi
          cat > notes.md <<EOF
          **On your phone:** tap hold-${N}-phone-test.apk to download and install it. Allow installs from your browser if Android asks.

          **For Play Console:** hold-${N}.aab is ${signed}.

          Built from commit ${GITHUB_SHA::7}.
          EOF
          sed -i 's/^          //' notes.md
          gh release create "build-${N}" out/* --target "$GITHUB_SHA" --title "Hold build ${N}" --notes-file notes.md --prerelease
          echo "::notice title=Released::build-${N}"

name: Store graphics

on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'assets/**'
      - 'scripts/store-graphics.mjs'
      - '.github/workflows/store.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  graphics:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install packages
        run: |
          chmod +x scripts/ci-run.sh
          scripts/ci-run.sh "npm install" npm install --no-audit --no-fund
          scripts/ci-run.sh "playwright + sharp" npm install --no-save --no-audit --no-fund playwright sharp
          scripts/ci-run.sh "chromium" npx playwright install --with-deps chromium

      - name: Draw the graphics
        run: |
          scripts/ci-run.sh "build-web" node scripts/build-web.mjs
          scripts/ci-run.sh "store-graphics" node scripts/store-graphics.mjs
          echo "::notice title=Graphics::$(ls store | tr '\n' ' ')"

      - name: Save them to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add store/
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Store graphics from ${GITHUB_SHA::7} [skip ci]"
            git pull --rebase origin main
            git push
          fi
